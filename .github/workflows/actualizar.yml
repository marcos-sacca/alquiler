name: Actualizar alquileres
# Todos los días a las 12:00 de Argentina baja Zonaprop y guarda los datos en el repo; GitHub Pages sirve index.html.
# Si Zonaprop bloquea a los servidores de GitHub, el paso "Bajar" falla (queda en rojo) y no se pisa nada.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: actualizar
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bajar
        run: node tracker.mjs
      - name: Guardar
        run: |
          git config user.name "tracker"
          git config user.email "tracker@users.noreply.github.com"
          git add data data.js
          git commit -m "Datos $(date -u +%F)" || echo "sin cambios"
          git push
